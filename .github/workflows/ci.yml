name: CI

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-2022
            npm_arch: x64
          - os: macos-latest
            npm_arch: arm64
          - os: ubuntu-latest
            npm_arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'

      - name: Install Dependencies
        run: npm install
        env:
          npm_config_arch: ${{ matrix.npm_arch }}

      - name: Run Tests
        run: npm test
